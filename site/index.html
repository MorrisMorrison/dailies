<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dailies</title>
<meta name="description" content="Do your dailies. A tiny checklist for the basics: get outside, move, hydrate, eat well, rest, connect. No account, nothing leaves your device, fresh every morning.">
<meta name="theme-color" content="#27306b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dailies">
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<!-- iOS ignores SVG icons on the home screen; it wants a square 180×180 PNG and rounds the corners itself. -->
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/editor.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div class="starfield" aria-hidden="true"></div>
<div class="page">
<main>
  <header class="top">
    <span id="date"></span>
    <button type="button" class="edit" id="edit">Edit</button>
  </header>
  <h1 id="greeting">Do your dailies.</h1>

  <!-- The sun's arc doubles as the progress meter. app.js moves the sun along it (see ARC there). -->
  <div class="arc" aria-hidden="true">
    <div class="halo" id="halo"></div>
    <svg viewBox="0 0 320 180">
      <line class="horizon" x1="0" y1="170" x2="320" y2="170"/>
      <path class="track" d="M20 170A140 140 0 0 1 300 170"/>
      <path class="trail" id="trail" pathLength="1" d="M20 170A140 140 0 0 1 300 170"/>
      <g class="sun" id="sun"><circle class="corona" r="22"/><circle class="disc" r="11"/></g>
    </svg>
    <div class="count"><b id="count">0/6</b><span id="count-line">Fresh start.</span></div>
  </div>
  <p class="sr-only" id="live" aria-live="polite"></p>

  <figure class="quote" id="quote" hidden>
    <blockquote id="quote-text"></blockquote>
    <figcaption id="quote-by"></figcaption>
  </figure>

  <ul class="cards" id="cards"></ul>

  <section class="your-sky" aria-labelledby="your-sky-title">
    <div class="your-sky-head"><h2 id="your-sky-title">Your sky</h2><span id="your-sky-count"></span></div>
    <svg id="constellation" viewBox="0 0 300 120" role="img"></svg>
    <p class="your-sky-note" id="your-sky-note"></p>
  </section>

  <p class="note">Fresh every morning. Nothing leaves this device.<br><a href="https://github.com/MorrisMorrison/dailies">Source on GitHub</a></p>
</main>
</div>

<dialog class="editor" id="editor" tabindex="-1" aria-labelledby="editor-title">
  <form method="dialog">
    <header>
      <h2 id="editor-title">Your dailies</h2>
      <p>Choose what you want to show up for. Everything stays on this device and resets at midnight.</p>
    </header>
    <ul class="editor-list" id="editor-list"></ul>
    <p class="sr-only" id="editor-live" aria-live="polite"></p>
    <footer>
      <button type="button" class="button" id="editor-reset">Reset to defaults</button>
      <button class="button button-primary" value="done">Done</button>
    </footer>
  </form>
</dialog>
</body>
</html>
