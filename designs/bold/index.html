<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dailies · Bold</title>
<meta name="theme-color" content="#0f0f0e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0e; --fg: #f2eee6; --dim: #6f6c66; --hot: #ff5b1f;
    --dd-bg: #f2eee6; --dd-fg: #0f0f0e; --dd-muted: #6f6c66; --dd-accent: #0f0f0e; --dd-line: rgba(0,0,0,.1);
    --dd-font: 'JetBrains Mono', ui-monospace, monospace; --dd-radius: 0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100dvh; background: var(--bg); color: var(--fg); font-family: 'JetBrains Mono', ui-monospace, monospace; -webkit-font-smoothing: antialiased; }
  main { max-width: 760px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px 36px; }

  .bar { display: flex; justify-content: space-between; align-items: center; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  .bar button { all: unset; cursor: pointer; color: var(--fg); }
  .bar button:focus-visible, .word:focus-visible { outline: 2px solid var(--hot); outline-offset: 4px; }
  .score {
    margin: 18px 0 6px; font-family: 'Anton', Impact, sans-serif; font-weight: 400; line-height: .85;
    font-size: clamp(88px, 34vw, 240px); letter-spacing: -.01em; color: var(--hot); display: flex; align-items: baseline; gap: .04em;
  }
  .score small { font-size: .32em; color: var(--dim); }

  ol { list-style: none; margin: 0; padding: 0; counter-reset: n; }
  li { counter-increment: n; border-top: 1px solid #2a2927; }
  li:last-child { border-bottom: 1px solid #2a2927; }
  .word {
    appearance: none; border: 0; background: none; cursor: pointer; width: 100%; padding: 6px 0 2px; text-align: left; color: var(--fg);
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; -webkit-tap-highlight-color: transparent;
  }
  .w {
    font-family: 'Anton', Impact, sans-serif; text-transform: uppercase; line-height: 1;
    font-size: clamp(54px, 17vw, 118px); letter-spacing: .005em;
    color: transparent; -webkit-text-stroke: 1.5px var(--fg);
    background: linear-gradient(var(--fg), var(--fg)) no-repeat 0 0 / 0% 100%;
    -webkit-background-clip: text; background-clip: text;
    transition: background-size .55s cubic-bezier(.7,0,.2,1);
  }
  .side { display: grid; justify-items: end; gap: 6px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); text-align: right; max-width: 15ch; }
  .side::before { content: counter(n, decimal-leading-zero); color: var(--fg); }
  .word .dd-icon { width: 26px; height: 26px; color: var(--dim); transition: color .3s; }
  .word[aria-pressed="true"] .w { background-size: 100% 100%; }
  .word[aria-pressed="true"] .dd-icon { color: var(--hot); }
  @media (max-width: 480px) { .side span { display: none; } }

  .foot { margin-top: 20px; display: flex; justify-content: space-between; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <div class="bar"><span id="date"></span><button type="button" id="edit">[ Edit ]</button></div>
  <div class="score" aria-live="polite"><span id="done"></span><small id="total"></small></div>
  <ol id="list"></ol>
  <div class="foot"><span id="msg"></span><span>Resets 00:00</span></div>
</main>

<script src="../core.js"></script>
<script>
  const list = document.getElementById('list');
  const two = (n) => String(n).padStart(2, '0');

  function render() {
    list.innerHTML = Dailies.list.map((d) => `
      <li><button class="word" type="button" data-id="${d.id}" aria-pressed="${Dailies.isDone(d.id)}" aria-label="${d.label}">
        <span class="w">${d.short}</span>
        <span class="side">${Dailies.icon(d.id)}<span>${d.hint}</span></span>
      </button></li>`).join('');
    paint();
  }

  function paint() {
    const { done, total } = Dailies.progress;
    list.querySelectorAll('.word').forEach((w) => w.setAttribute('aria-pressed', Dailies.isDone(w.dataset.id)));
    document.getElementById('done').textContent = two(done);
    document.getElementById('total').textContent = '/' + two(total);
    document.getElementById('msg').textContent = done === total ? 'Done. Go live a little.' : done ? 'Keep going' : 'Do your dailies';
  }

  list.addEventListener('click', (e) => { const w = e.target.closest('.word'); if (w) Dailies.toggle(w.dataset.id); });
  document.getElementById('edit').addEventListener('click', Dailies.openEditor);
  document.getElementById('date').textContent = Dailies.date({ weekday: 'short', day: '2-digit', month: 'short' });

  let shown = Dailies.list.map((d) => d.id).join();
  Dailies.onChange(() => {
    const ids = Dailies.list.map((d) => d.id).join();
    ids === shown ? paint() : ((shown = ids), render());
  });
  render();
</script>
</body>
</html>
