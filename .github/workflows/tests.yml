name: Tests

# Runs on pull requests, and on main as the first step of Deploy (which calls it), so nothing is
# published before both jobs pass.
on:
  pull_request:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Node only, nothing installed; with Node's built-in coverage of site/js/.
      - run: npm run coverage:unit
      - uses: codecov/codecov-action@v7
        with:
          files: coverage/unit.lcov
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # The page in real browsers: WebKit (iPhone) and Chromium (Android, desktop). Playwright is a
  # dev-only dependency; the site itself has none. Chromium also reports coverage (WebKit can't).
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit chromium
      - run: npm run test:browser
        env:
          COVERAGE: '1'
      - run: npm run coverage:browser
      - uses: codecov/codecov-action@v7
        with:
          files: coverage/browser/lcov.info
          flags: browser
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
